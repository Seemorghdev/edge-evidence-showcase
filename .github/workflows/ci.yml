name: integrated-showcase-ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install required system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg make sqlite3
      - name: Install deterministic local tooling
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install "setuptools==82.0.1" "pytest==8.4.1"
          bash scripts/setup.sh
      - name: Test showcase and bundled worker boundaries
        env:
          NO_PROXY: "*"
        run: make test
      - name: Run two deterministic integrated demonstrations
        env:
          NO_PROXY: "*"
        run: |
          make demo OUTPUT_ROOT=.demo-output-a
          make --silent fingerprint OUTPUT_ROOT=.demo-output-a > /tmp/fingerprint-a.json
          make demo OUTPUT_ROOT=.demo-output-b
          make --silent fingerprint OUTPUT_ROOT=.demo-output-b > /tmp/fingerprint-b.json
          diff -u /tmp/fingerprint-a.json /tmp/fingerprint-b.json
      - name: Inspect without mutation and package safe evidence
        run: |
          before="$(make fingerprint OUTPUT_ROOT=.demo-output-a)"
          make inspect OUTPUT_ROOT=.demo-output-a > /tmp/inspect.txt
          after="$(make fingerprint OUTPUT_ROOT=.demo-output-a)"
          test "$before" = "$after"
          make artifact OUTPUT_ROOT=.demo-output-a
      - name: Verify guarded cleanup
        run: |
          make clean OUTPUT_ROOT=.demo-output-b
          test ! -e .demo-output-b
          test -f README.md
      - name: Upload safe synthetic evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: integrated-showcase-safe-evidence
          path: .demo-output-a/ci-artifact
          if-no-files-found: error
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical runtime and development targets
        run: |
          docker build --target runtime -t edge-evidence-showcase:runtime .
          docker build --target dev -t edge-evidence-showcase:dev .
      - name: Run runtime image without external network as non-root
        run: |
          set -euo pipefail
          mkdir -p container-output
          network="edge-evidence-showcase-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cid=""
          cleanup() {
            if [[ -n "$cid" ]]; then
              docker rm -f "$cid" >/dev/null 2>&1 || true
            fi
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$network" >/dev/null
          cid="$(docker create --network "$network" --entrypoint /bin/bash \
            edge-evidence-showcase:runtime \
            -c 'cd /workspace/showcase && test "$(id -u)" = 10001 && /usr/bin/make demo OUTPUT_ROOT=.demo-output-container && /usr/bin/make inspect OUTPUT_ROOT=.demo-output-container > /tmp/container-inspect.txt')"
          docker start --attach "$cid"
          docker cp "$cid:/workspace/showcase/.demo-output-container/." container-output/
          docker cp "$cid:/tmp/container-inspect.txt" /tmp/container-inspect.txt
          test -f container-output/combined/summary.json
          test -s /tmp/container-inspect.txt
      - name: Smoke the bounded HTTP service locally
        run: |
          set -euo pipefail
          network="edge-evidence-showcase-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          name="edge-evidence-showcase-http"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$network" >/dev/null
          docker run --detach --name "$name" \
            --network "$network" \
            --publish 127.0.0.1:18080:8080 \
            --cpus 1 \
            --memory 512m \
            --pids-limit 256 \
            --security-opt no-new-privileges \
            --env PORT=8080 \
            edge-evidence-showcase:runtime
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs "$name"
              exit 1
            fi
            sleep 1
          done
          python3 scripts/smoke_live.py \
            --url http://127.0.0.1:18080 \
            --allow-http \
            | tee /tmp/local-service-smoke.json
